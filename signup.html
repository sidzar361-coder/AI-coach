<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup-style.css">
    <title>Ai-interview-coach</title>
</head>
<body>
    <section class="container">
            <section class="header">
                <h1>InterviewAI</h1>
                <span id="icon">🤖</span>
            </section>
        <section class="card">
            <form>
                <section class="card-content">
                    <h1>Create Your Account</h1>
                    <section class="name">
                        <section class="first-name">
                            <label>First Name</label>
                            <input type="text" id="input" placeholder="Enter first name" required>
                        </section>
                        <section class="last-name">
                            <label>Last Name</label>
                            <input type="text" id="input" placeholder="Enter last name" required>
                        </section>
                    </section>
                    <section class="second-sect">
                        <section class="email">
                            <label>Email ID</label>
                            <input type="email" id="input" placeholder="Enter your email" required>
                        </section>
                        <section class="phone">
                            <label>Phone No.</label>
                            <input type="text" id="input" placeholder="Enter your phone number" required>
                        </section>
                        </section>
                        <section class="pass">
                         <section class="new-pass">
                            <label>New Password</label>
                            <input type="password" id="input" placeholder="Enter new password" required>
                        </section>
                        <section class="conf-pass">
                            <label>Confirm Password</label>
                            <input type="password" id="input" placeholder="Confirm Password" required>
                        </section>
                        </section>
                    
                    <button type="submit" class="submit-btn">Create</button>  
            </form>
                <navbar class="navigation">
                    <p>Already have an account?</p>
                    <a href="signin.html">Login</a>
                </navbar>
            </section>
        </section>
    </section>
</body>
</html>
