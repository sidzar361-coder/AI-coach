<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup-style.css">
    <title>Ai-interview-coach</title>
</head>
<body>
    <section class="container">
            <section class="header">
                <h1>InterviewAI</h1>
                <span id="icon">🤖</span>
            </section>
        <section class="card">
            <form onsubmit="return false;">
                <section class="card-content">
                    <h1>Create Your Account</h1>
                    <section class="name">
                        <section class="first-name">
                            <label>First Name</label>
                            <input type="text" id="first_name" placeholder="Enter first name" required[cite: 1]>
                        </section>
                        <section class="last-name">
                            <label>Last Name</label>
                            <input type="text" id="last_name" placeholder="Enter last name" required[cite: 1]>
                        </section>
                    </section>
                    <section class="second-sect">
                        <section class="email">
                            <label>Email ID</label>
                            <input type="email" id="email" placeholder="Enter your email" required[cite: 1]>
                        </section>
                        <section class="phone">
                            <label>Phone No.</label>
                            <input type="text" id="phone" placeholder="Enter your phone number" required[cite: 1]>
                        </section>
                        </section>
                        <section class="pass">
                         <section class="new-pass">
                            <label>New Password</label>
                            <input type="password" id="new_password" placeholder="Enter new password" required[cite: 1]>
                        </section>
                        <section class="conf-pass">
                            <label>Confirm Password</label>
                            <input type="password" id="confirm_password" placeholder="Confirm Password" required[cite: 1]>
                        </section>
                        </section>
                    
                    <button type="button" class="submit-btn" py-click="register_user" href="signin.html">Create</button>  
            </form>
                <navbar class="navigation">
                    <p>Already have an account?</p>
                    <a href="signin.html">Login</a>
                </navbar>
            </section>
        </section>
    </section>
    <script type="py" src="./table.py"></script>
</body>
</html>
