<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin-style.css">
    <title>Ai-interview-coach</title>
</head>
<body>
    <section class="container">
            <section class="header">
                <h1>InterviewAI</h1>
                <span id="icon">🤖</span>
            </section>
        <section class="card">
            <form onsubmit="return false;">
                <section class="card-content">
                    <h1>Welcome Back!</h1>
                    <section class="input">
                            <label>Email id</label>
                            <section class="icon-text">
                                <svg class="icon-search-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35" fill="black"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                <input type="email" id="email-id" placeholder="Enter your email" required[cite: 2]>
                            </section>
                    </section>
                    <section class="input">
                            <label id="password-label">Password</label>
                            <section class="icon-text">
                                <svg class="icon-search-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><path d="m21 2-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.778-7.778zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                                <input type="password" id="password" placeholder=" Enter your password" required[cite: 2]>
                            </section>
                    </section>
                     <button type="button" class="submit-btn" py-click="login_user">Login</button>    
                </form>
                <navbar class="navigation">
                    <p>New here?</p>
                    <a href="signup.html">Create a new account</a>
                </navbar>
            </section>
        </section>
    </section>
    <script type="py" src="./signin.py"></script>
</body>
</html>
