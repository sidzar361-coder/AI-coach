<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signin-style.css">
    <title>Ai-interview-coach</title>
</head>
<body>
    <section class="container">
        <section class="header">
            <h1>InterviewAI</h1>
            <img src="logo.png" alt="InterviewAI Logo" class="header-logo">
        </section>
        <section class="card">
            <form onsubmit="return false;">
                <section class="card-content">
                    <h1>Welcome Back!</h1>
                    <section class="input">
                            <label>Email id</label>
                            <section class="icon-text">
                                <svg class="icon-search-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35" fill="black"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                                <input type="email" id="email-id" placeholder="Enter your email" required>
                            </section>
                    </section>
                    <section class="input">
                        <label id="password-label">Password</label>
                        <section class="icon-text">
                            <svg class="icon-search-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="35" height="35" fill="black"><path d="M21 10h-8.35C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H15v2h2v-2h2v2h2v-4zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
                            <input type="password" id="password" placeholder="Enter your password" required>
                        </section>
                    </section>
                     <button type="button" class="submit-btn" py-click="login_user">Login</button>    
                </form>
                <navbar class="navigation">
                    <p>New here?</p>
                    <a href="signup.html">Create a new account</a>
                </navbar>
            </section>
        </section>
    </section>
    <script type="py" src="./signin.py"></script>
</body>
</html>
